<!doctype html>
<html lang="es">
  <body style="margin:0;padding:24px;background:#f4f6f9;font-family:Arial,sans-serif;color:#1e293b">
    <table role="presentation" style="max-width:600px;margin:0 auto;background:#fff;border-radius:8px;padding:32px">
      <tr>
        <td>
          <h1 style="font-size:22px;color:#b30000">Recuperación de contraseña SGR</h1>
          <p>Se solicitó un cambio de contraseña para tu cuenta del Sistema de Gestión de Resultados.</p>
          <p>
            <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}"
               style="display:inline-block;padding:12px 18px;background:#b30000;color:#fff;text-decoration:none;border-radius:5px">
              Crear nueva contraseña
            </a>
          </p>
          <p>Si no solicitaste este cambio, ignora este correo. Tu contraseña no cambiará sin completar el enlace.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
