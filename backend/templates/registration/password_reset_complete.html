{% extends "base.html" %}
{% block title %}Contraseña actualizada | Matriz SGR{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4 p-md-5 text-center">
        <i class="bi bi-check-circle text-success display-4" aria-hidden="true"></i>
        <h1 class="h4 mt-3">Contraseña actualizada</h1>
        <p class="text-secondary">Tu contraseña se cambió correctamente. Ya puedes iniciar sesión con tu nueva contraseña.</p>
        <a href="{% url 'web_login' %}" class="btn btn-danger mt-2">Ir a iniciar sesión</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
